<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#192d29"><meta name="description" content="Build a living realm. Shape a world of resources, monsters and settlements, then adventure alongside 49 autonomous players."><title>Realmstead · A Living Realm</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head><body>
<div id="game">
<header><div class="brand"><span class="crest">♜</span><div><h1>REALMSTEAD</h1><span>A LIVING REALM</span></div></div><div class="realm-stats"><button id="funds" title="Realm finances"><span class="coin">●</span><strong id="gold">1,650</strong><small>Realm gold</small></button><button id="population"><span>♟</span><strong id="pop">10 / 50</strong><small>Adventurers</small></button><button id="progress"><span>✧</span><strong id="merit">0 / 8</strong><small>Milestones</small></button></div><div class="time-controls"><button id="pause" aria-label="Pause">Ⅱ</button><button class="speed active" data-speed="1">1×</button><button class="speed" data-speed="2">2×</button><button class="speed" data-speed="4">4×</button><button id="settings" aria-label="Settings">⚙</button></div></header>
<main id="viewport"><canvas id="world" aria-label="Interactive realm map. Choose a build tool then tap the map to place it. Drag to pan."></canvas><div class="map-heading"><span class="eyebrow">YOUR WORLD, THEIR STORIES</span><h2 id="realm-name">The Greenhaven frontier</h2><p id="map-subtitle">A small settlement. An unwritten future.</p></div><div class="map-tools"><button id="zoom-in" title="Zoom in">＋</button><button id="zoom-out" title="Zoom out">−</button><button id="home" title="Center village">⌂</button><span></span><button id="undo" title="Undo build stroke">↶</button><button id="redo" title="Redo build stroke">↷</button><button id="brush" title="Change terrain brush size">1</button><button id="help" title="How to play">?</button></div><button id="my-status" class="player-status"><span class="avatar">♟</span><span><b>Levi <small>YOUR ADVENTURER</small></b><span id="my-task">Choosing a task…</span><span class="health-track"><i id="health-fill"></i></span></span><span class="goto">↗</span></button><div id="selection-panel" hidden></div><div id="toasts" aria-live="polite"></div><div class="world-bottom"><span id="day">DAY 1 · MORNING</span><button id="feed-peek">The realm is waking up…</button><span id="saved">Autosave ready</span></div></main>
<footer><nav id="main-nav"><button class="active" data-view="build">⚒ <span>Build world</span></button><button data-view="roster">♟ <span>Adventurers</span></button><button data-view="player">⚔ <span>My character</span></button><button data-view="journal">☷ <span>Chronicle</span><i id="event-dot"></i></button><span class="nav-spacer"></span><button id="inspect" class="active">↖ <span>Inspect / pan</span></button></nav><section id="build-tray"><div class="build-categories"><div id="categories"><button class="active" data-category="terrain">Landscape</button><button data-category="building">Settlement</button><button data-category="resource">Resources</button><button data-category="monster">Enemies</button><button data-category="decor">Decor</button></div><span id="build-hint">Choose a tool · drag map to explore</span></div><div id="palette"></div><div class="tool-description"><span id="tool-description">Build the world your adventurers will call home.</span><button id="erase">⌫ Demolish</button></div></section></footer>
</div><dialog id="modal"><div class="modal-header"><div><span class="eyebrow" id="modal-eyebrow">REALMSTEAD</span><h2 id="modal-title"></h2></div><button id="close-modal" aria-label="Close dialog">×</button></div><div id="modal-content"></div></dialog><input id="import-file" type="file" accept=".json,application/json" hidden><script type="module" src="app.js"></script></body></html>
